<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Регистрация — БагТрек</title>
<link rel="stylesheet" href="../../css/main.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-wordmark">Баг<br>Трек</div>
  <div class="badge-card">
    <div class="clip"></div>
    <div class="bc-head"><h2>Регистрация</h2><span class="keybox">B</span></div>
    <div class="bc-body">
      <div class="field"><label>Имя</label><input class="input" type="text" id="reg-name" autocomplete="name"></div>
      <div class="field"><label>Почта</label><input class="input" type="email" id="reg-email" autocomplete="username"></div>
      <div class="field"><label>Пароль</label><div class="pass-wrap"><input class="input" type="password" id="reg-pass" autocomplete="new-password"><span class="eye" id="reg-eye" title="Показать пароль"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></span></div></div>
      <div class="banner red u-mb-12 is-hidden" id="reg-error"></div>
      <a class="btn lg wide" id="reg-btn" href="../projects/no-projects.html">Зарегистрироваться</a>
      <div class="auth-alt">Уже есть аккаунт? <a href="login.html">Войти</a></div>
    </div>
  </div>
</div>

</body>
</html>
